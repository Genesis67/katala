<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login · Katala Homes</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="admin-login-page">
    <div class="admin-login-container">
        <div class="admin-login-box">
            <div class="admin-login-header">
                <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px;">
                    
                </div>
                <h2 style="background:var(--gold-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;">Katala Homes</h2>
                <p style="color:#888;margin-top:-4px;">Admin Login</p>
            </div>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="admin@katalahomes.com" value="admin@katalahomes.com" required />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" value="password" required />
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
                <p style="text-align:center;margin-top:12px;font-size:0.85rem;color:#888;">Demo: admin@katalahomes.com / password</p>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
